name: Update GitHub Stats Data

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6:00 AM UTC
  workflow_dispatch:       # Allow manual trigger

env:
  NODE_VERSION: '20.x'
  APP_DIR: 'src/frontend'
  DIST_DIR: 'src/frontend/dist'

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '${{ env.APP_DIR }}/package-lock.json'

      - name: Fetch GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_USERNAME: 'JoeyRubas'
        run: node scripts/fetch-github-data.js

      - name: Install frontend deps
        run: npm ci
        working-directory: ${{ env.APP_DIR }}

      # Compile LaTeX resume BEFORE the Vite build
      - name: Compile Resume from .tex
        uses: xu-cheng/latex-action@v4
        with:
          root_file: src/frontend/src/pages/resume/resume.tex
          work_in_root_file_dir: true

      - name: Place compiled resume in Vite public/
        run: |
          set -e
          mkdir -p src/frontend/public/resume
          cp src/frontend/src/pages/resume/resume.pdf src/frontend/public/resume/JoeyResume.pdf
          echo "Copied to public/resume/JoeyResume.pdf"

      - name: Export build vars
        run: |
          echo "VITE_SHOW_EDIT_FUNCTIONALITY=false" >> $GITHUB_ENV
          echo "VITE_USE_MOCK_DATA=false" >> $GITHUB_ENV

      - name: Build (Vite)
        env:
          NODE_ENV: production
        run: npm run build
        working-directory: ${{ env.APP_DIR }}

      - name: Include staticwebapp.config.json
        run: |
          if [ -f "${{ env.APP_DIR }}/staticwebapp.config.json" ]; then
            cp "${{ env.APP_DIR }}/staticwebapp.config.json" "${{ env.DIST_DIR }}/"
          fi

      - name: Validate artifact
        run: |
          test -f "${{ env.DIST_DIR }}/index.html"
          grep -q '<script type="module"' "${{ env.DIST_DIR }}/index.html"
          ! grep -q '/src/main\.' "${{ env.DIST_DIR }}/index.html" || (echo "ERROR: dev index.html detected"; exit 1)
          test -f "${{ env.DIST_DIR }}/data/github-stats.json" || echo "WARNING: github-stats.json missing (data fetch may have failed)"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: ${{ env.DIST_DIR }}
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
